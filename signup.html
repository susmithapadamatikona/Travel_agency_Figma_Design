<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign up — Phines Travels</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body class="login-page">

<main class="login-shell">
  <div class="login-card login-card--signup">
    <a href="index.html" class="login-logo" aria-label="Stackly home"><img src="assets/images/logo-dark.webp" alt="Stackly" /></a>
    <h1 class="login-title">Sign up</h1>
    <p class="login-sub">Let&rsquo;s get you all set up so you can access your personal account.</p>

    <form class="login-form" id="signupForm" novalidate>
      <div class="lg-field">
        <label class="lg-label" for="suName">Full Name</label>
        <input type="text" id="suName" class="lg-input" placeholder="Ann Pine" autocomplete="name" />
      </div>

      <div class="lg-pair">
        <div class="lg-field">
          <label class="lg-label" for="suEmail">Email</label>
          <input type="email" id="suEmail" class="lg-input" placeholder="ann.pine@gmail.com" autocomplete="email" />
        </div>
        <div class="lg-field">
          <label class="lg-label" for="suPhone">Phone Number</label>
          <input type="tel" id="suPhone" class="lg-input" placeholder="233 034 3456 578" autocomplete="tel" />
        </div>
      </div>

      <div class="lg-field">
        <label class="lg-label" for="suPassword">Password</label>
        <input type="password" id="suPassword" class="lg-input" value="••••••••••••••" autocomplete="new-password" />
        <button type="button" class="lg-eye" data-eye="suPassword" aria-label="Show password" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M2.5 2.5 21.5 21.5" />
            <path d="M10.6 5.3A9.6 9.6 0 0 1 12 5.2c5 0 9 4.3 10 6.8a13.6 13.6 0 0 1-3 3.9" />
            <path d="M6.3 6.9A13.7 13.7 0 0 0 2 12c1 2.5 5 6.8 10 6.8a9.9 9.9 0 0 0 4-.85" />
            <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2" />
          </svg>
        </button>
      </div>

      <div class="lg-field">
        <label class="lg-label" for="suConfirm">Confirm Password</label>
        <input type="password" id="suConfirm" class="lg-input" value="••••••••••••••" autocomplete="new-password" />
        <button type="button" class="lg-eye" data-eye="suConfirm" aria-label="Show password" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M2.5 2.5 21.5 21.5" />
            <path d="M10.6 5.3A9.6 9.6 0 0 1 12 5.2c5 0 9 4.3 10 6.8a13.6 13.6 0 0 1-3 3.9" />
            <path d="M6.3 6.9A13.7 13.7 0 0 0 2 12c1 2.5 5 6.8 10 6.8a9.9 9.9 0 0 0 4-.85" />
            <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2" />
          </svg>
        </button>
      </div>

      <div class="lg-field lg-field--select">
        <label class="lg-label" for="suRole">Select Role</label>
        <select id="suRole" class="lg-input lg-select">
          <option value="traveller" selected>Traveller</option>
          <option value="agent">Travel Agent</option>
          <option value="admin">Admin</option>
        </select>
        <svg viewBox="0 0 24 24" class="lg-caret" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
      </div>

      <div class="lg-row lg-row--agree">
        <label class="lg-check">
          <input type="checkbox" id="suAgree" />
          <span class="lg-box" aria-hidden="true"></span>
          <span>I agree to all the <a href="#">Terms</a> and <a href="#">Privacy Policies</a></span>
        </label>
      </div>

      <button type="submit" class="lg-submit">Create account</button>

      <p class="lg-signup">Already have an account? <a href="login.html">Login</a></p>
    </form>

    <div class="lg-divider"><span>Or Sign up with</span></div>

    <div class="lg-social">
      <a href="#" class="lg-social-btn" aria-label="Sign up with Facebook">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#1877F2" d="M24 12.07C24 5.4 18.63 0 12 0S0 5.4 0 12.07C0 18.1 4.39 23.09 10.13 24v-8.44H7.08v-3.49h3.05V9.41c0-3.02 1.79-4.69 4.53-4.69 1.31 0 2.68.24 2.68.24v2.96h-1.51c-1.49 0-1.96.93-1.96 1.89v2.26h3.33l-.53 3.49h-2.8V24C19.61 23.09 24 18.1 24 12.07Z"/></svg>
      </a>
      <a href="#" class="lg-social-btn" aria-label="Sign up with Google">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path fill="#4285F4" d="M23.52 12.27c0-.85-.08-1.67-.22-2.45H12v4.64h6.46a5.52 5.52 0 0 1-2.4 3.62v3.01h3.88c2.27-2.09 3.58-5.17 3.58-8.82Z"/>
          <path fill="#34A853" d="M12 24c3.24 0 5.96-1.08 7.94-2.91l-3.88-3.01c-1.08.72-2.45 1.15-4.06 1.15-3.12 0-5.77-2.11-6.72-4.95H1.28v3.11A12 12 0 0 0 12 24Z"/>
          <path fill="#FBBC05" d="M5.28 14.28a7.2 7.2 0 0 1 0-4.56V6.61H1.28a12 12 0 0 0 0 10.78l4-3.11Z"/>
          <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.44-3.44C17.95 1.19 15.24 0 12 0A12 12 0 0 0 1.28 6.61l4 3.11C6.23 6.86 8.88 4.75 12 4.75Z"/>
        </svg>
      </a>
      <a href="#" class="lg-social-btn" aria-label="Sign up with Apple">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#000" d="M17.05 12.66c-.03-2.72 2.22-4.02 2.32-4.09-1.26-1.85-3.23-2.1-3.93-2.13-1.68-.17-3.27 0.99-4.12.99-.85 0-2.16-.96-3.55-.94-1.83.03-3.51 1.06-4.45 2.7-1.9 3.29-.49 8.17 1.36 10.84.9 1.31 1.98 2.77 3.4 2.72 1.36-.06 1.88-.88 3.53-.88 1.65 0 2.11.88 3.55.85 1.47-.03 2.4-1.33 3.3-2.64 1.04-1.51 1.47-2.98 1.5-3.05-.03-.02-2.88-1.1-2.91-4.37ZM14.32 4.6c.75-.91 1.25-2.17 1.11-3.43-1.08.04-2.38.72-3.15 1.62-.69.8-1.29 2.08-1.13 3.31 1.2.09 2.43-.61 3.17-1.5Z"/></svg>
      </a>
    </div>
  </div>
</main>

<script src="js/main.js" defer></script>
</body>
</html>
